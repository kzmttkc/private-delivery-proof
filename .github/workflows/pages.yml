name: pages
# Serves public/ (did.json) at https://kzmttkc.github.io/private-delivery-proof/ for the did:web in the records.
on:
  push:
    branches: [main]
    paths: [public/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: d
        uses: actions/deploy-pages@v4
